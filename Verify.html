                    class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none"

                <input
                    class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none tracking-[0.25em]"
                    id="verification-code"

<!-- Cognito Authentication -->
<script src="auth.js"></script>

<script>

    // Get email from URL
    const params = new URLSearchParams(window.location.search);

    const emailFromSignup = params.get("email");

    const emailInput = document.getElementById("email");

    if (emailFromSignup) {
        emailInput.value = emailFromSignup;
    }


    // Verify account
    document
        .getElementById("verify-form")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const code =
                document.getElementById("verification-code").value.trim();

            if (!email || !code) {
                alert("Please enter your email and verification code.");
                return;
            }

            try {

                await confirmUserSignUp(email, code);

                alert(
                    "Email verified successfully! You can now log in."
                );

                window.location.href = "Login.html";

            } catch (error) {

                console.error("Verification error:", error);

                alert(
                    error.message ||
                    "Verification failed. Please check the code and try again."
                );

            }

        });


    // Resend verification code
    document
        .getElementById("resend-code")
        .addEventListener("click", async function () {

            const email =
                document.getElementById("email").value.trim();

            if (!email) {
                alert("Please enter your email address.");
                return;
            }

            try {

                await resendVerificationCode(email);

                alert(
                    "A new verification code has been sent to your email."
                );

            } catch (error) {

                console.error("Resend error:", error);

                alert(
                    error.message ||
                    "Unable to resend the verification code."
                );

            }

        });

</script>
