<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign Up - ShortenIt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"surface-variant": "#d2e4f8", error: "#ba1a1a", "on-tertiary": "#ffffff", tertiary: "#004c7a", outline: "#777587", "surface-container-lowest": "#ffffff", "on-surface": "#0b1d2b", "on-tertiary-fixed-variant": "#004a77", "on-primary-fixed": "#001d32", secondary: "#42617c", "on-surface-variant": "#464555", "on-secondary-container": "#45647e", "on-error-container": "#93000a", "primary-container": "#44637f", "error-container": "#ffdad6", "on-primary-fixed-variant": "#2a4965", "surface-container-highest": "#d2e4f8", "surface-tint": "#42617d", "primary-fixed": "#cde5ff", "secondary-container": "#c1e0ff", "surface-container-high": "#d8eafe", background: "#f7f9ff", "on-primary-container": "#c0dfff", surface: "#f7f9ff", "inverse-on-surface": "#e7f2ff", "on-tertiary-container": "#c2deff", "outline-variant": "#c7c4d8", "surface-bright": "#f7f9ff", "tertiary-fixed": "#cfe5ff", "secondary-fixed": "#cce5ff", "on-secondary-fixed-variant": "#2a4a63", "on-background": "#0b1d2b", "on-tertiary-fixed": "#001d33", "surface-container": "#e2efff", "tertiary-container": "#296494", "inverse-surface": "#213241", "primary-fixed-dim": "#aacaea", "surface-dim": "#cadcf0", "on-error": "#ffffff", "inverse-primary": "#aacaea", "on-secondary": "#ffffff", "on-secondary-fixed": "#001e31", primary: "#2b4b66", "secondary-fixed-dim": "#aacae8", "tertiary-fixed-dim": "#98cbff", "surface-container-low": "#edf4ff", "on-primary": "#ffffff"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {lg: "24px", "margin-desktop": "32px", md: "16px", "margin-mobile": "16px", base: "4px", xs: "4px", "2xl": "48px", sm: "8px", gutter: "24px", xl: "32px"}, fontFamily: {"label-md": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"], "body-sm": ["Inter"], code: ["Inter"], "headline-md": ["Inter"], "display-lg": ["Inter"], headline: ["Inter"], display: ["Inter"], body: ["Inter"], label: ["Inter"]}, fontSize: {"label-md": ["14px", {lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500"}], "label-sm": ["12px", {lineHeight: "16px", fontWeight: "600"}], "body-md": ["16px", {lineHeight: "24px", fontWeight: "400"}], "headline-sm": ["20px", {lineHeight: "28px", fontWeight: "600"}], "body-lg": ["18px", {lineHeight: "28px", fontWeight: "400"}], "body-sm": ["14px", {lineHeight: "20px", fontWeight: "400"}], code: ["14px", {lineHeight: "20px", fontWeight: "400"}], "headline-md": ["24px", {lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600"}], "display-lg": ["36px", {lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700"}]}}}};</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-color: #f9f9ff;
            background-image: radial-gradient(#c7c4d8 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center bg-pattern font-body-md p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg md:p-xl relative overflow-hidden">
<!-- Decorative subtle glow -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-primary-container"></div>
<div class="text-center mb-lg">
<h1 class="font-headline-md text-headline-md text-primary font-bold mb-sm">ShortenIt</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Create your account to start managing links.</p>
</div>
<form action="Dashboard.html" class="space-y-md" method="GET">
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="name">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</span>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 outline-none" id="name" name="name" placeholder="John Doe" required="" type="text">
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</span>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 outline-none" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</span>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 outline-none" id="password" name="password" oninput="updateStrength(this.value)" placeholder="••••••••" required="" type="password">
</div>
<!-- Password Strength Indicator -->
<div class="mt-2 flex space-x-1 h-1.5 w-full bg-surface-variant rounded-full overflow-hidden" id="strength-bar-container">
<div class="h-full w-0 transition-all duration-300 bg-error" id="strength-bar"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 text-right" id="strength-text">Weak</p>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="confirm_password">Confirm Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock_reset">lock_reset</span>
</span>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 outline-none" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password">
</div>
</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md py-sm px-md rounded-lg transition-colors flex justify-center items-center gap-2 mt-lg shadow-sm" type="submit">
                Create Account
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="font-label-md text-label-md text-primary hover:underline font-medium" href="Login.html">Login</a>
</p>
</div>
</div>
<script>
        function updateStrength(password) {
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            let strength = 0;
            if (password.length > 5) strength += 25;
            if (password.length > 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) strength += 25;

            bar.style.width = strength + '%';

            if (strength <= 25) {
                bar.className = 'h-full transition-all duration-300 bg-error';
                text.textContent = 'Weak';
                text.className = 'font-label-sm text-label-sm mt-1 text-right text-error';
            } else if (strength <= 75) {
                bar.className = 'h-full transition-all duration-300 bg-secondary-fixed-dim';
                text.textContent = 'Fair';
                text.className = 'font-label-sm text-label-sm mt-1 text-right text-secondary-fixed-dim';
            } else {
                bar.className = 'h-full transition-all duration-300 bg-secondary';
                text.textContent = 'Strong';
                text.className = 'font-label-sm text-label-sm mt-1 text-right text-secondary';
            }
            
            if(password.length === 0) {
                 bar.style.width = '0%';
                 text.textContent = '';
            }
        }
    </script>
</body></html>
